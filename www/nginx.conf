worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1936;
        chunk_size 4096;

application live {
    live on;
    record off;

    allow play all;
    play_restart on;

    # включаем HLS
    hls on;
    hls_path /var/www/hls;
    hls_fragment 3;
    hls_playlist_length 300;
    hls_cleanup on;

    # Отправляем события publish => скрипт стартует при публикации потока
#    exec_push /usr/bin/python3 /var/www/live-server/start_vk.py $name;
}
    }
}

http {
    include        /usr/local/nginx/conf/mime.types;
    default_type  application/octet-stream;
    # Без этого статика (index.html заглушки kem-sirius.ru) отдаётся с
    # Content-Type: text/html БЕЗ charset — браузер угадывает кодировку
    # сам и кириллица превращается в "РєРµРј-СЃРёСЂРёСѓСЃ" (мохито/mojibake),
    # даже если сам файл на диске в правильном UTF-8. Обнаружено вживую
    # при проверке заглушки через настоящий браузер.
    charset utf-8;

    server {
        listen 8082;

        location / {
            proxy_pass http://127.0.0.1:8083;
            # $http_host (а не $host) — сохраняет порт, которым клиент
            # реально обращался к сайту. $host его отрезает, из-за чего
            # Flask (request.host_url, напр. ссылка на просмотр в API
            # мониторинга и ссылка подтверждения e-mail) строил адрес на
            # дефолтный порт 80 вместо настоящего :8082.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
        }

        location /hls {
            root /var/www;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*';
        }

        location ^~ /tables/yandex/vnc/ {
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }
    }

    # kem-sirius.ru — отдельный сайт (а не 8082, где слушает админка).
    # HTTPS включён на боевом сервере вручную (сертификат GlobalSign DV
    # kem-sirius.ru + www, общий с почтовым сервером по SAN mail/owa) —
    # сами файлы сертификата/ключа НЕ в git, только пути ниже. Если когда-
    # нибудь понадобится узнать, где реально лежат файлы — /etc/ssl/kem-sirius/
    # на самом сервере, не в этом репозитории.
    server {
        listen 80;
        server_name kem-sirius.ru www.kem-sirius.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name kem-sirius.ru www.kem-sirius.ru;

        ssl_certificate     /etc/ssl/kem-sirius/fullchain.pem;
        ssl_certificate_key /etc/ssl/kem-sirius/privkey.key;

        root /var/www/kem-sirius;
        index index.html;

        # Публичная форма регистрации (www/registration-public) — отдельный
        # изолированный процесс, без доступа к app.db основного сайта (см.
        # план curried-weaving-hummingbird.md). Ссылки вида
        # secrets.token_urlsafe(16) — ровно 22 символа [A-Za-z0-9_-], это и
        # есть то, чем регэксп отличает их от остальных маршрутов сайта.
        # Форм (и, соответственно, ссылок) может быть несколько одновременно
        # — все они проксируются на один и тот же registration-public,
        # который сам смотрит, какой именно форме соответствует ссылка
        # (см. sync_public_forms_export() в live-server/server.py — экспорт
        # это словарь {slug: форма}, не одна запись). Регэксп-локейшен
        # проверяется раньше обычного "location /" (у которого нет ^~),
        # поэтому порядок строк в файле на это не влияет, но держим его
        # рядом для наглядности.
        location ~ "^/[A-Za-z0-9_-]{22}$" {
            proxy_pass http://127.0.0.1:8086;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
        }

        # Статика самой формы (form.css) — Flask внутри registration-public
        # отдаёт её по умолчанию с /static/, а шаблоны формы ссылаются на
        # неё абсолютным путём от корня домена ("/static/form.css"), а не
        # относительно /<slug>/ — без этого location запрос падал в
        # заглушку ниже и получал 404, из-за чего форма показывалась
        # совсем без стилей (воспроизведено вживую). ^~ — чтобы не гонять
        # зря через regex-location выше (он всё равно не матчит "/static/...",
        # но так короче путь проверки).
        location ^~ /static/ {
            proxy_pass http://127.0.0.1:8086;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
        }

        # Всё остальное (главная страница, опечатки в ссылке, уже снятая
        # с публикации форма) — заглушка "сайт в разработке", пока для
        # kem-sirius.ru нет отдельного полноценного сайта.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
