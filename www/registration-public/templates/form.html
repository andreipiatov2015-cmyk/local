<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/form.css" />
</head>
<body>
  <main class="form-page">
    <h1>{{ title }}</h1>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
      {% for q in questions %}
        <div class="field">
          <label for="q_{{ q.qtype }}">{{ q.label }}</label>
          {% if q.qtype == "people_count" %}
            <input type="number" min="1" step="1" id="q_{{ q.qtype }}" name="{{ q.qtype }}"
                   value="{{ submitted.get(q.qtype, '') if submitted else '' }}" required>
          {% else %}
            <input type="text" id="q_{{ q.qtype }}" name="{{ q.qtype }}"
                   value="{{ submitted.get(q.qtype, '') if submitted else '' }}" required>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit">Отправить</button>
    </form>
  </main>
</body>
</html>
